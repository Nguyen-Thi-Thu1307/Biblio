{% extends "base.html" %} {% block title %}{{ t('auth.login_title') }} - Biblio{% endblock %} {%
block content %}
<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <h2>{{ t('auth.login_title') }}</h2>
  <label>{{ t('auth.username') }} <input type="text" name="username" autocomplete="username" required /></label>
  <label>{{ t('auth.password') }} <input type="password" name="password" autocomplete="current-password" required /></label>
  <button class="btn" type="submit">{{ t('auth.login_button') }}</button>
  {% include "auth/_social_buttons.html" %}
  <p>{{ t('auth.no_account') }} <a href="{{ url_for('auth.register') }}">{{ t('auth.register_button') }}</a></p>
</form>
{% endblock %}
